name: Deploy AWS Production Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aws-production-platform-dev
  ECS_CLUSTER: aws-production-platform-dev-cluster
  ECS_SERVICE: aws-production-platform-dev-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print GitHub context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "Ref: ${{ github.ref }}"
          echo "Workflow: ${{ github.workflow }}"

      - name: Print OIDC token claims
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "GitHub did not return an OIDC token."
            echo "$RESPONSE"
            exit 1
          fi

          PAYLOAD=$(echo "$TOKEN" \
            | cut -d '.' -f2 \
            | tr '_-' '/+' \
            | awk '{
                remainder = length($0) % 4
                if (remainder == 2) {
                  $0 = $0 "=="
                } else if (remainder == 3) {
                  $0 = $0 "="
                }
                print
              }' \
            | base64 --decode)

          echo "$PAYLOAD" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            ref,
            workflow
          }'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::479752408129:role/aws-production-platform-dev-github-actions-role
          role-session-name: github-actions-deploy

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          docker build \
            -t "$ECR_REPOSITORY:latest" \
            ./app

          docker tag \
            "$ECR_REPOSITORY:latest" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment